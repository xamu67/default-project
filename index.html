<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juanita's</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">

      <a href="#" class="logo">
        <img class="logo-icon" src="logo.svg" alt="">
        <span class="logo-text">Juanita's</span>
      </a>

      <form class="search" role="search" action="/buscar" method="get">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
        </span>
        <input
          type="search"
          name="q"
          class="search-input"
          placeholder="Buscar producto, marca, categorías..."
          aria-label="Buscar producto, marca, categorías"
        >
      </form>

      <a href="#" class="btn-home">Volver a inicio</a>

    </div>
  </header>
</body>
</html>
